server:
  port: ${ATS_PORT:8095}   # Orbit uses 8090; 8080 is SPS GlassFish.
  shutdown: graceful
  tomcat:
    # Read the rest of an oversized upload so the client gets the 413 instead of a dropped connection.
    max-swallow-size: -1

spring:
  application:
    name: ats-backend
  # ATS shares Orbit's schema for now; every ATS table is prefixed ATS_.
  # The password has no default on purpose — set ATS_DB_PASSWORD in the environment.
  datasource:
    url: jdbc:oracle:thin:@//${ATS_DB_HOST:10.0.11.56}:${ATS_DB_PORT:1521}/${ATS_DB_SERVICE:intgtest}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${ATS_DB_USER:SIMW}
    password: ${ATS_DB_PASSWORD:}
    hikari:
      pool-name: ats-pool
      maximum-pool-size: 10
  servlet:
    multipart:
      # Same limit as ats.attachments.max-mb; the request limit covers up to 10 files in one go.
      max-file-size: ${ATS_ATTACHMENTS_MAX_MB:20}MB
      max-request-size: ${ATS_ATTACHMENTS_MAX_REQUEST_MB:100}MB
  jpa:
    open-in-view: false
    hibernate:
      # Never let Hibernate touch the shared schema: ATS tables are created only
      # by the versioned scripts in db/ats (see SchemaMigrator).
      ddl-auto: none
    properties:
      hibernate:
        # ATS columns are plain TIMESTAMP (not WITH TIME ZONE), read in the server's zone.
        type.preferred_instant_jdbc_type: TIMESTAMP
        default_batch_fetch_size: 50
    show-sql: false

ats:
  db:
    migrate: ${ATS_DB_MIGRATE:true}
  security:
    # Separate from Orbit's secret: an Orbit token is never valid in ATS.
    jwt-secret: ${ATS_JWT_SECRET:}
    session-hours: 10
    cookie-name: ATS_SESSION
    cookie-secure: ${ATS_COOKIE_SECURE:false}
    max-failed-logins: 5
    lock-minutes: 15
  bootstrap-admin:
    username: ${ATS_ADMIN_USERNAME:admin}
    full-name: System Administrator
    email: ${ATS_ADMIN_EMAIL:}
    # Used only when ATS_USERS is empty. If blank, a random password is generated
    # and printed once to the log; the admin must change it on first login.
    initial-password: ${ATS_ADMIN_INITIAL_PASSWORD:}
  cors:
    allowed-origins: ${ATS_CORS_ORIGINS:http://localhost:3010}
  attachments:
    dir: ${ATS_ATTACHMENTS_DIR:./data/attachments}
    max-mb: ${ATS_ATTACHMENTS_MAX_MB:20}
  # Base URL used in links inside notification emails.
  public-url: ${ATS_PUBLIC_URL:http://localhost:3010}
  # Emails are always queued in ATS_EMAIL_OUTBOX; they are only sent while enabled is true.
  # Only new tickets send email (to the vendor side). All other updates are in-app only.
  mail:
    enabled: ${ATS_MAIL_ENABLED:false}
    host: ${ATS_MAIL_HOST:}
    port: ${ATS_MAIL_PORT:25}
    from: ${ATS_MAIL_FROM:}
    username: ${ATS_MAIL_USERNAME:}
    password: ${ATS_MAIL_PASSWORD:}
    starttls: ${ATS_MAIL_STARTTLS:false}
    # Extra addresses (comma-separated) that get the new-ticket email, besides the active HQ (VENDOR) users.
    vendor-recipients: ${ATS_MAIL_VENDOR_RECIPIENTS:}
